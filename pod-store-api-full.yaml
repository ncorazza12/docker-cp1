apiVersion: v1
kind: Pod
metadata:
  name: store-api-full
  namespace: store-dev
  labels:
    app: store-api
    tier: backend
    env: dev
spec:
  volumes:
    - name: shared-data
      emptyDir: {}

  initContainers:
    - name: init-config
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Gerando configuração inicial..."
          echo "APP_ENV=dev" > /data/config.txt
          echo "INIT_TIMESTAMP=$(date)" >> /data/config.txt
          echo "Config criada com sucesso"
          cat /data/config.txt
      volumeMounts:
        - name: shared-data
          mountPath: /data
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"

  containers:
    - name: store-api
      image: store-api:1.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8000
      volumeMounts:
        - name: shared-data
          mountPath: /data
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      readinessProbe:
        httpGet:
          path: /ready
          port: http
      livenessProbe:
        httpGet:
          path: /health
          port: http

    - name: log-sidecar
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Sidecar iniciado, monitorando /data/config.txt"
          while true; do
            echo "[sidecar] $(date) - conteudo atual:"
            cat /data/config.txt
            sleep 15
          done
      volumeMounts:
        - name: shared-data
          mountPath: /data
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"