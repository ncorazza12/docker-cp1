apiVersion: v1
kind: Pod
metadata:
  name: store-api
  namespace: store-dev
  labels:
    app: store-api
    tier: backend
    env: dev
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: store-api
      image: store-api:1.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8000
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: store-api
  namespace: store-dev
spec:
  type: ClusterIP
  selector:
    app: store-api
    env: dev
  ports:
    - port: 80
      targetPort: 9000
